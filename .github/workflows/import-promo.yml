name: Import updated promo video

on:
  push:
    paths:
      - '.github/workflows/import-promo.yml'

permissions:
  contents: write

jobs:
  import-promo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download updated promo
        env:
          PROMO_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-b288-8210-8a6a-42a643a1595c/raw?se=2026-09-17T18%3A29%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=009925f5-9322-5d04-bf3b-6799f0f929b0&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T18%3A12%3A51Z&ske=2026-09-18T18%3A12%3A51Z&sks=b&skv=2026-02-06&sig=AKuC3WkfOXUoe5Y8LqBEsAbujDmDFpHlP0OhpBBvw1k%3D"
        run: |
          curl -L --fail --retry 3 "$PROMO_URL" -o /tmp/promo.mov
          test -s /tmp/promo.mov

      - name: Convert for web
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p assets
          ffmpeg -y -i /tmp/promo.mov \
            -vf "scale=720:-2:flags=lanczos" \
            -c:v libx264 -preset medium -crf 25 -pix_fmt yuv420p \
            -movflags +faststart \
            -c:a aac -b:a 96k \
            assets/promo-web.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of json assets/promo-web.mp4

      - name: Commit updated promo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/promo-web.mp4
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Обновить промо-видео без цен"
            git push
          fi
