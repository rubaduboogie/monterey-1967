name: Assemble design assets

on:
  push:
    paths:
      - '.asset-chunks/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble image assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          assemble () {
            src="$1"
            dst="$2"
            cat ".asset-chunks/$src/"*.txt | tr -d '\n\r' | base64 -d > "assets/$dst"
            test -s "assets/$dst"
            echo "$dst $(stat -c%s "assets/$dst") bytes"
          }
          assemble guest role-guest.webp
          assemble reporter role-reporter.webp
          assemble groupie role-groupie.webp
          assemble artist role-artist.webp
          assemble footer footer-panorama.webp
          assemble icons includes-icons.webp

      - name: Commit assembled assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/role-guest.webp assets/role-reporter.webp assets/role-groupie.webp assets/role-artist.webp assets/footer-panorama.webp assets/includes-icons.webp
          if git diff --cached --quiet; then
            echo 'No asset changes'
          else
            git commit -m 'Assemble corrected design assets'
            git push
          fi
