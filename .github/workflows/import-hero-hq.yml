name: Import HQ hero video

on:
  push:
    paths:
      - '.github/workflows/import-hero-hq.yml'

permissions:
  contents: write

jobs:
  import-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Hero.mov
        env:
          HERO_URL: "https://sdmntprukwest.oaiusercontent.com/files/00000000-fcfc-8243-8302-a3559f060d33/raw?se=2026-09-17T19%3A09%3A49Z&sp=r&sv=2026-02-06&sr=b&scid=3e850d24-fe0a-5e70-9593-d53f634f6ff5&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T18%3A08%3A25Z&ske=2026-09-18T18%3A08%3A25Z&sks=b&skv=2026-02-06&sig=WUfcQmv2bS79aNow%2BN3ZEiFKwyRAXiewWoIQs%2B3rlfM%3D"
        run: |
          curl -L --fail --retry 3 "$HERO_URL" -o /tmp/hero.mov
          test -s /tmp/hero.mov

      - name: Convert hero for web
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p assets
          ffmpeg -y -i /tmp/hero.mov \
            -an \
            -c:v libx264 -preset medium -crf 21 -pix_fmt yuv420p \
            -movflags +faststart \
            assets/hero-web.mp4
          ffmpeg -y -ss 1.2 -i /tmp/hero.mov -frames:v 1 \
            -vf "scale=1280:-2:flags=lanczos" -q:v 3 \
            assets/hero-poster.jpg
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of json assets/hero-web.mp4

      - name: Commit HQ hero and poster
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-web.mp4 assets/hero-poster.jpg
          git commit -m "Улучшить качество hero-видео" || exit 0
          git push
